name: Update casks

# A safety net, not the publishing path: each tool's release workflow pushes its own
# cask here as part of the release. This daily run repairs the tap if such a push was
# missed. GitHub starts scheduled workflows late, so nothing may depend on its timing.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release-published]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-casks
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pull the newest cask of each tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p Casks
          git config user.name "Ari Mendelow"
          git config user.email "16390116+arimendelow@users.noreply.github.com"
          while read -r repo; do
            case "$repo" in ""|"#"*) continue ;; esac
            tool="${repo#*/}"
            # Newest stable release only. main is what users install: a prerelease (an rc
            # rehearsal) never belongs here; each tool's own release workflow puts those on the
            # rehearsal branch.
            tag="$(gh release list -R "$repo" --limit 50 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName // empty')"
            if [ -z "$tag" ]; then
              echo "$repo: no release yet, skipping"
              continue
            fi
            tmp="$(mktemp -d)"
            if ! gh release download "$tag" -R "$repo" -p "$tool.rb" -D "$tmp"; then
              echo "$repo $tag: no $tool.rb asset, skipping"
              continue
            fi
            # Never move a cask backwards: keep a later version already on main.
            if [ -f "Casks/$tool.rb" ]; then
              current="$(sed -n 's/^[[:space:]]*version "\([^"]*\)"[[:space:]]*$/\1/p' "Casks/$tool.rb" | head -n 1)"
              # A prerelease on main is itself the defect to repair, never a version to keep.
              case "$current" in *-*) current="" ;; esac
              if [ -n "$current" ] && [ "$current" != "${tag#v}" ] && [ "$(printf '%s\n%s\n' "$current" "${tag#v}" | sort -V | tail -n 1)" = "$current" ]; then
                echo "$repo $tag: main already has $current, keeping it"
                continue
              fi
            fi
            if [ -f "Casks/$tool.rb" ] && cmp -s "$tmp/$tool.rb" "Casks/$tool.rb"; then
              echo "$repo $tag: cask unchanged"
              continue
            fi
            cp "$tmp/$tool.rb" "Casks/$tool.rb"
            git add "Casks/$tool.rb"
            git commit -m "$tool ${tag#v}"
          done < tools.txt
          if [ -n "$(git log origin/main..HEAD --oneline)" ]; then
            git push origin HEAD:main
            # Check the new cask on a clean Mac right away. Only a run that
            # published something starts the check.
            gh workflow run verify-casks.yml -R "$GITHUB_REPOSITORY" --ref main
          else
            echo "Nothing to push"
          fi
